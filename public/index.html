<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study-Buddy</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
</head>
<body>
<div class="app">
    <header class="app-header">
        <h1>Study-Buddy</h1>
        <p>Stel vragen over je studie documents</p>
    </header>

    <main class="chat-container">
        <div id="chatMessages" class="chat-messages">
            <div class="message bot">
                <div class="message-content">
                    <p>Hi. Vraag me iets zoals: <strong>Hoe krijg ik Gevorderd volgens de Evaluatiecriteria?</strong></p>
                </div>
            </div>
        </div>

        <form id="chatForm" class="chat-form">
        <textarea
                id="promptInput"
                placeholder="Type your question here..."
                rows="3"
                required
        ></textarea>

            <div class="form-actions">
                <button type="submit" id="sendButton">Send</button>
                <button type="button" id="testButton">Run Test</button>
            </div>
        </form>

        <section class="sources-section">
            <h2>Relevant Documents</h2>
            <div id="sourcesList" class="sources-list">
                <p class="empty-state">No sources yet.</p>
            </div>
        </section>
    </main>
</div>
</body>
</html>
